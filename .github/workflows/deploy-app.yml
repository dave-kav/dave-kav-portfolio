name: Deploy App

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Config Package
        run: pnpm --filter @dave-kav/config build

      - name: Type Check
        run: pnpm --filter @dave-kav/${{ inputs.app }} tsc --noEmit

      - name: Build React App
        run: pnpm --filter @dave-kav/${{ inputs.app }} build

      - name: Deploy to Cloudflare Pages (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ inputs.app }}/build --project-name=dave-kav-${{ inputs.app }}

      - name: Deploy to Cloudflare Pages (Preview)
        id: preview-deploy
        if: github.event_name == 'pull_request'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/${{ inputs.app }}/build --project-name=dave-kav-${{ inputs.app }} --branch=${{ github.head_ref }}

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const app = '${{ inputs.app }}';
            const branch = '${{ github.head_ref }}';
            const previewUrl = `https://${branch}.dave-kav-${app}.pages.dev`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(`Preview (${app})`)
            );

            const body = `### 🚀 Preview (${app})\n\n` +
              `**URL:** ${previewUrl}\n\n` +
              `_Updated: ${new Date().toISOString()}_`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
