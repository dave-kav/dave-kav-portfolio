name: Deploy dave-kav.com

on:
  push:
    branches: [main]
    paths:
      - 'apps/com/**'
      - 'packages/config/**'
  pull_request:
    paths:
      - 'apps/com/**'
      - 'packages/config/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/deploy-app-preview.yml
    with:
      app: com
    secrets: inherit

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-app-production.yml
    with:
      app: com
    secrets: inherit
