name: Deploy dave-kav.com

on:
  push:
    branches: [main]
    paths:
      - 'apps/com/**'
      - 'packages/config/**'
  pull_request:
    paths:
      - 'apps/com/**'
      - 'packages/config/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: com
    secrets: inherit
