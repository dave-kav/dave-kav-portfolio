name: Deploy dave-kav.dev

on:
  push:
    branches: [main]
    paths:
      - 'apps/dev/**'
      - 'packages/config/**'
  pull_request:
    paths:
      - 'apps/dev/**'
      - 'packages/config/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: dev
    secrets: inherit
