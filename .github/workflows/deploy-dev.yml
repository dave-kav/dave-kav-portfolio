name: Deploy dave-kav.dev

on:
  push:
    branches: [main]
    paths:
      - 'apps/dev/**'
      - 'packages/config/**'
  pull_request:
    paths:
      - 'apps/dev/**'
      - 'packages/config/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/deploy-app-preview.yml
    with:
      app: dev
    secrets: inherit

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-app-production.yml
    with:
      app: dev
    secrets: inherit
