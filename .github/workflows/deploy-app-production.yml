name: Deploy App (Production)

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Config Package
        run: pnpm --filter @dave-kav/config build

      - name: Type Check
        run: pnpm --filter @dave-kav/${{ inputs.app }} tsc --noEmit

      - name: Build React App
        run: pnpm --filter @dave-kav/${{ inputs.app }} build

      - name: Deploy to Cloudflare Pages
        uses: andykenward/github-actions-cloudflare-pages@v3.0.0
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project-name: dave-kav-${{ inputs.app }}
          directory: apps/${{ inputs.app }}/build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-environment: production
